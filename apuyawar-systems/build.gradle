plugins {
    id 'fabric-loom'
}
version = project.mod_version
base {
    archivesName = 'apuyawar-systems'
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.register('verifyJudgments', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pe.apuyawar.systems.EventVerification'
}
tasks.named('check') { dependsOn 'verifyJudgments' }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        apuyawar_systems { sourceSet sourceSets.main }
        apuyawar_systems_tests { sourceSet sourceSets.gametest }
    }
    runs {
        judgmentGameTest {
            server()
            name 'APU YAWAR pruebas aisladas'
            source sourceSets.gametest
            runDir 'build/judgment-gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=reports/results.xml'
        }
    }
}
