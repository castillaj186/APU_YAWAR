plugins {
    id 'fabric-loom'
}
version = project.mod_version
base {
    archivesName = 'momento-cuy'
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // modImplementation da acceso de compilacion/runtime al modulo; include
    // (jar-in-jar) hace que Loom lo empaquete DENTRO del jar de momento-cuy
    // en vez de depender de su cache separada de "mods remapeados" para
    // dependencias de proyecto (.gradle/loom-cache/remapped_mods/), que
    // resulto estar indexada por (id, version) y no por contenido -- servia
    // una copia congelada de la primera vez que se corrio runClient sin
    // importar cuantas veces se recompilara apuyawar-lighting despues (ver
    // docs/23, seccion 17). Con include(), processIncludeJars (tarea normal
    // de Gradle, con las dependencias de tarea correctas hacia
    // :apuyawar-lighting:remapJar) se encarga de que el contenido siempre
    // sea el actual -- sin borrar nada del classpath a mano.
    //
    // La primera vez que se intento include() (antes de que
    // apuyawar-lighting existiera) Loom exigia que el jar ya existiera en
    // disco para poder configurar este modulo, lo que era un punto muerto
    // de arranque en un modulo hermano nuevo. Ya no aplica: el jar existe
    // desde la primera build exitosa del modulo.
    modImplementation project(':apuyawar-lighting')
    include project(':apuyawar-lighting')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
