plugins {
    id 'fabric-loom'
}
version = project.mod_version
base {
    archivesName = 'momento-cuy'
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Dependencia de proyecto normal, NO jar-in-jar (Loom's include() exige
    // que el jar del modulo dependido ya exista antes de poder configurar
    // este modulo, lo cual es un punto muerto de arranque la primera vez
    // que se crea un modulo hermano nuevo). Se distribuyen como dos jars
    // separados: la integracion real (MomentoCuyLightingBridge) igual se
    // protege en tiempo de ejecucion con FabricLoader.isModLoaded, asi que
    // un servidor/cliente sin apuyawar-lighting instalado sigue funcionando.
    modImplementation project(':apuyawar-lighting')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
